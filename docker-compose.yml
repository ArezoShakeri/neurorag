# Milestone 1 scope: backend + frontend only. Ollama runs natively on the host (not
# containerized) because Docker Desktop doesn't pass through Apple Silicon GPU acceleration;
# the backend reaches it via host.docker.internal. See docs/setup.md.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./database/chroma_store:/app/database/chroma_store

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
