[project]
name = "neurorag"
version = "0.1.0"
description = "Open-source AI Research Assistant for Alzheimer's disease literature"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.38",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-chroma>=0.1",
    "langchain-huggingface>=0.1",
    "langchain-ollama>=0.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
    "pypdf>=4.3",
    "pyyaml>=6.0",
    "tenacity>=8.5",
    "faster-whisper>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.2"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-mock>=3.14"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["settings"]

[tool.setuptools.packages.find]
include = ["backend*", "frontend*", "agent*", "retrieval*", "rag*", "database*", "prompts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
